# version: "3.8"
services:
    minio-s3:
        image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
        container_name: minio
        ports:
            - "9000:9000"      # S3 API
            - "9001:9001"      # Web Console
        environment:
            MINIO_ROOT_USER: admin
            MINIO_ROOT_PASSWORD: admin123
        command: server /data --console-address ":9001"
        healthcheck:
            test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/ready" ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 20s
        networks:
            ecodex:
        volumes:
            - minio_data:/data
    activemq:
        image: apache/activemq-classic:6.2.0
        container_name: activemq
        ports:
            - "8161:8161"   # Web console
            - "61616:61616" # OpenWire
            - "1099:1099"   # JMX RMI registry
            - "1199:1199"   # JMX RMI server (second port RMI needs)
        environment:
            ACTIVEMQ_CONNECTION_USER: admin
            ACTIVEMQ_CONNECTION_PASSWORD: admin
            JAVA_OPTS: >-
                -Dcom.sun.jndi.rmiregistry.registryImpl=true
                -Dcom.sun.management.jmxremote
                -Dcom.sun.management.jmxremote.port=1099
                -Dcom.sun.management.jmxremote.rmi.port=1199
                -Dcom.sun.management.jmxremote.ssl=false
                -Dcom.sun.management.jmxremote.authenticate=false
                -Djava.rmi.server.hostname=activemq
        healthcheck:
            test: [ "CMD", "curl", "-f", "http://localhost:8161" ]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            ecodex:
        volumes:
            - activemq-data:/var/lib/activemq/data
    gateway-db:
        container_name: gateway_db_mysql
        # can be replaced with the appropriate database image. e.g. postgres
        image: mysql:8
        restart: always
        environment:
            # can be replaced with the appropriate database env. e.g. POSTGRES_PASSWORD, POSTGRES_USER ...
            MYSQL_DATABASE: gateway
            MYSQL_USER: gateway
            MYSQL_PASSWORD: gateway
            MYSQL_ROOT_PASSWORD: gateway
            MYSQL_TCP_PORT: 3307
        ports:
            - "30007:3307"
        expose:
            - "3307"
        healthcheck:
            test: [ 'CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-p$$MYSQL_ROOT_PASSWORD' ]
            interval: 3s
            retries: 5
            timeout: 5s
        networks:
            ecodex:
        volumes:
            - ./docker/gateway/sql/:/docker-entrypoint-initdb.d/
            - gateway-mysql-data:/var/lib/mysql
    gateway:
        container_name: gateway
        image: scm.ecodex.eu/docker/gateway:edge
        environment:
            DOMIBUS_DATABASE_SERVERNAME: gateway-db
            DOMIBUS_DATABASE_PORT: 3307
            DOMIBUS_DATABASE_SCHEMA: gateway
            DOMIBUS_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
            DOMIBUS_DATASOURCE_USER: gateway
            DOMIBUS_DATASOURCE_PASSWORD: gateway
            JAVA_IO_TMPDIR: ./temp
        depends_on:
            gateway-db:
                condition: service_healthy
        ports:
            - "30010:8080"
        expose:
            - "8080"
        networks:
            ecodex:
        volumes:
            - ./docker/gateway/config/conf/domibus:/app/conf/domibus
            - gateway-attachments:/app/attachments
    connector-ng-db:
        container_name: mysql
        image: mysql:8
        restart: always
        environment:
            # can be replaced with the appropriate database env. e.g. POSTGRES_PASSWORD, POSTGRES_USER ...
            MYSQL_DATABASE: connector
            MYSQL_USER: connector
            MYSQL_PASSWORD: connector
            MYSQL_ROOT_PASSWORD: connector
            MYSQL_TCP_PORT: 3306
        ports:
            - "30006:3306"
        expose:
            - "3306"
        healthcheck:
            test: [ 'CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-p$$MYSQL_ROOT_PASSWORD' ]
            interval: 3s
            retries: 5
            timeout: 5s
        networks:
            ecodex:
        volumes:
            # based on your DBMS, initial scripts can be found in connector-distribution/src/main/resources/dbscripts/initial
            # copy and place them in sql folder
            # - ./sql/:/docker-entrypoint-initdb.d/
            - ng-mysql-data:/var/lib/mysql
    connector-ng-maria-db:
        image: mariadb:12.3.2
        container_name: mariadb
        restart: always
        environment:
            MARIADB_DATABASE: connector
            MARIADB_USER: connector
            MARIADB_PASSWORD: connector
            MARIADB_ROOT_PASSWORD: connector
            MARIADB_TCP_PORT: 3306
        ports:
            - "30008:3306"
        expose:
            - "3306"
        networks:
            ecodex:
        volumes:
            - ng-mariadb-data:/var/lib/mysql
    connector-ng-postgres-db:
        image: postgres:17
        container_name: postgres
        restart: always
        environment:
            POSTGRES_USER: connector
            POSTGRES_PASSWORD: connector
            POSTGRES_DB: connector
        command:
            - "postgres"
            - "-c"
            - "max_prepared_transactions=100"
        expose:
            - "5432"
        ports:
            - "30032:5432"
        volumes:
            - ng-postgres-data:/var/lib/postgresql/data
    connector-ng-oracle-db:
        image: gvenzl/oracle-free:23-slim
        container_name: connector-oracle
        # profiles: [ "oracle" ]
        environment:
            ORACLE_PASSWORD: oracle
            APP_USER: connector
            APP_USER_PASSWORD: connector
        expose:
            - "1521"
        ports:
            - "30021:1521"
        volumes:
            - oracle-data:/opt/oracle/oradata
            - ./docker/oracle/init:/container-entrypoint-initdb.d:ro
        healthcheck:
            test: [ "CMD", "healthcheck.sh" ]
            interval: 10s
            timeout: 5s
            retries: 30
            start_period: 60s
    connector-ng:
        container_name: connector-ng
        # uncomment the bellow section if you want to build your connector image during the launch of docker-compose
        # build:
        #   context: ./
        #   dockerfile: Dockerfile
        image: connector-ng:activemq
        depends_on:
            connector-ng-db:
                condition: service_healthy
            minio-s3:
                condition: service_started
            activemq:
                condition: service_started
        env_file:
            - ./docker.env
        ports:
            - "30000:30000"
        expose:
            - "30000"
        networks:
            ecodex:
        volumes:
            - ./docker/connector/config:/app/config
networks:
    ecodex:
        driver: bridge
        ipam:
            config:
                - subnet: 172.20.0.0/16
volumes:
    ng-mysql-data:
    ng-mariadb-data:
    ng-postgres-data:
    gateway-mysql-data:
    gateway-attachments:
    minio_data:
    activemq-data:
    oracle-data:
