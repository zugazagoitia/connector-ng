# MariaDB
# spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
# Postgres
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Oracle
# spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
# Set proper db driver class name
# H2 (tests)
# spring.datasource.driver-class-name=org.h2.Driver
# MySQL
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# MariaDB
# spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
# Postgres
# spring.datasource.driver-class-name=org.postgresql.Driver
# Oracle
# spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
##################################################################################
############################### ACTIVE MQ CONFIGURATIONS #########################
##################################################################################
spring.activemq.broker-url=vm://embedded?broker.persistent=false&broker.useJmx=false
spring.activemq.user=admin
spring.activemq.password=admin
#spring.activemq.pool.enabled=false
spring.activemq.packages.trust-all=true
spring.jms.listener.min-concurrency=1
spring.jms.listener.max-concurrency=10
spring.jms.cache.enabled=false
# default to 5
# connector.activemq.address-settings.max-delivery-attempts=5
# default to 60s (60000)
# connector.activemq.address-settings.redelivery-delay=60000
#default to 2
# connector.activemq.address-settings.redelivery-multiplier=2
##################################################################################
############################ JTA CONFIGURATION ###################################
##################################################################################
# default is true
#spring.jta.enabled=false
# default is ./data/jtalog
#spring.jta.log-file=./data/jtalog
#
#spring.jta.atomikos.datasource.max-pool-size=60
#spring.jta.atomikos.connectionfactory.max-pool-size=60
#spring.jta.atomikos.datasource.unique-resource-name=connector-data-source
#
#spring.jta.atomikos.properties.default-jta-timeout=3m
#spring.jta.atomikos.properties.max-timeout=3m
##################################################################################
############################## FILE STORAGE CONFIGURATIONS #######################
##################################################################################
connector.file.storage.upload-temp-directory=/tmp
connector.file.storage.s3.secret-key=${S3_SECRET_KEY}
connector.file.storage.s3.access-key=${S3_ACCESS_KEY}
connector.file.storage.s3.region=${S3_REGION}
connector.file.storage.s3.bucket=${S3_BUCKET}
connector.file.storage.s3.endpoint=${S3_ENDPOINT}
##################################################################################
################################ MULTIPART CONFIGURATIONS ########################
##################################################################################
# enable multipart uploads (enabled by default, but good to be explicit)
spring.servlet.multipart.enabled=true
# max file size (default is 1MB)
spring.servlet.multipart.max-file-size=200MB
# max request size (default is 10MB)
spring.servlet.multipart.max-request-size=210MB
# file size threshold after which files are written to disk
spring.servlet.multipart.file-size-threshold=0
server.tomcat.max-swallow-size=-1
# Temporary location for uploaded files
spring.servlet.multipart.location=${connector.file.storage.upload-temp-directory}
# the number of parts allowed in a single multipart/form-data request.
server.tomcat.max-part-count=50
##################################################################################
############################### REST API DOC CONFIGURATIONS ######################
##################################################################################
# set to false disable swagger ui in the production environment
springdoc.swagger-ui.enabled=true
# set to false disable /v3/api-docs endpoint in the production environment
springdoc.api-docs.enabled=true
##################################################################################
################################# ACTUATOR CONFIGURATIONS ########################
##################################################################################
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=health,info
# Apache CXF 4.1.0 metrics are not compatible with spring boot 4.x.x actuator
# this workaround is needed to disable the metrics endpoint for now
# Apache CXF will be migrated to spring boot 4.x.x compatiblity once xmlsec 4 is supported by the connector
spring.autoconfigure.exclude=org.apache.cxf.spring.boot.autoconfigure.micrometer.MicrometerMetricsAutoConfiguration
##################################################################################
############################## OPEN TELEMETRY CONFIGURATIONS #####################
##################################################################################
management.otlp.metrics.export.enabled=false
# management.tracing.sampling.probability=1.0
# management.otlp.export.url=http://localhost:4318/v1/metrics
# management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces
# management.opentelemetry.logging.export.otlp.endpoint=http://localhost:4318/v1/logs
##################################################################################
################################# SOAP API CONFIGURATIONS ########################
##################################################################################
cxf.path=/services
##################################################################################
######################### REM EVIDENCE CONFIG ####################################
##################################################################################
connector.evidences.signature.keystore.path=classpath:keystores/connector-keystore.jks
connector.evidences.signature.keystore.password=12345
connector.evidences.signature.keystore.type=JKS
connector.evidences.signature.private-key.alias=connector_blue
connector.evidences.signature.private-key.password=12345
connector.evidences.signature.digest-algorithm=SHA256
connector.evidences.issuer.as4-party.name=Connector NG
connector.evidences.issuer.as4-party.endpoint-address=mailto:gateway@connector.example
connector.evidences.issuer.postal-address.street=Unknown Street 1
connector.evidences.issuer.postal-address.locality=Unknown
connector.evidences.issuer.postal-address.zip-code=0000
connector.evidences.issuer.postal-address.country=EU
##################################################################################
######################### DSS TOOL CONFIGURATIONS ################################
##################################################################################
# cache configuration
connector.dss.cache.location=file:./data/tlcache
connector.dss.cache.expiration=1d
# proxy configuration
# this proxy is used for downloading tls lists, crl updates, ocsp updates
#connector.dss.proxy.http.host=proxy1.example.com
