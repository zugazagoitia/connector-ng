##################################################################################
################################ MULTIPART CONFIGURATIONS ########################
##################################################################################
# enable multipart uploads (enabled by default, but good to be explicit)
spring.servlet.multipart.enabled=true
# max file size (default is 1MB )
spring.servlet.multipart.max-file-size=200MB
# max request size (default is 10MB)
spring.servlet.multipart.max-request-size=210MB
# file size threshold after which files are written to disk
spring.servlet.multipart.file-size-threshold=0
server.tomcat.max-swallow-size=-1
# Temporary location for uploaded files
spring.servlet.multipart.location=${TEMP_DIR_LOCATION}
# the number of parts allowed in a single multipart/form-data request.
server.tomcat.max-part-count=50

##################################################################################
################################### CORS CONFIGURATIONS ##########################
