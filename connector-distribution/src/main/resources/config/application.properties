################################################################################
############################ CONNECTOR-BACKEND-ROUTING #########################
################################################################################
# Routing configuration to which backend is the message transported?
# Master switch for message routing logic. When false, the routing rules below are ignored and
# messages are delivered to the default backend
connector.routing.enabled=true
# Fallback backend link to use when no routing rule below matches an
# incoming message. Acts as the catch-all destination.
connector.routing.default-backend-name=backend_alice
# -----------------------------------------------------------------
# Routing rules (indexed array — [0], [1], ... for multiple rules)
# -----------------------------------------------------------------
# Each rule pairs a target backend link with a match condition.
# Rules are evaluated in order, and the first matching rule's
# link-name determines where the message is routed.
# Match-clause syntax is a small expression language — e.g. equals(ServiceName, 'value') —
# evaluated against the AS4 properties of the message. Declare at most one rule per link-name.
connector.routing.backend-rules[0].link-name=backend_alice
connector.routing.backend-rules[0].description=routing rule for backend_alice
connector.routing.backend-rules[0].match-clause=equals(ServiceName, 'Test')
################################################################################
############################ CONNECTOR-BACKEND-AUTHENTICATION ##################
################################################################################
# This jwt secret key must be changed in production!
# The jwt secret is used as-is (UTF-8 bytes) and must be at least 32 characters long.
# The default Admin username is "admin". 123456 is the default password.
# This password must be changed at the first login, and should be changed here before deployment.
# The admin email address is also to be changed.
# The expiration time of the JWT access token is 15 minutes.
# The refresh token expiration time is 30 days.
# The refresh token cleanup cron is set to 0 0 3 * * * (every day at 3am).
connector.auth.security.jwt.secret=${JWT_SECRET_KEY}
connector.auth.security.jwt.expiration=15m
connector.auth.security.jwt.issuer=connector.ecodex.eu
connector.auth.security.jwt.refresh-token.expiration=30d
connector.auth.security.jwt.refresh-token.cleanup-cron=0 0 3 * * *
connector.admin.username=admin
connector.admin.password=123456
connector.admin.enabled=true
connector.admin.email=admin@test.com

