##################################################################################
############################ MESSAGE PROCESSING CONFIGURATIONS ###################
##################################################################################
# Whether REM evidence generated by the connector (e.g., submission acceptance/rejection,
# delivery/non-delivery evidence) is forwarded to the backend application or only kept/sent
# on the gateway side.
connector.message-processing.send-generated-evidences-to-backend=true
# Whether the connector automatically triggers delivery evidences for messages that have been
# delivered to the backend.
connector.message-processing.auto-trigger-delivery-evidences=true
# Whether the connector auto-generates ebMS message IDs itself rather than relying on IDs
# supplied by the backend or gateway.
connector.message-processing.ebms-id-generator-enabled=true
# Domain suffix appended when generating ebMS message IDs (ebMS message IDs are typically formatted
# as <uuid>@<suffix>, similar to an email Message-ID). Only takes effect when the generator above
# is enabled.
connector.message-processing.ebms-id-suffix=connector.ecodex.eu
# Domain suffix used when generating connector message identifiers (distinct from ebMS message
# IDs).
connector.message-processing.identifier-suffix=connector.ecodex.eu
# Domain suffix used for transport step identifiers, following the same <value>@<suffix>
# convention as the other two suffix settings above.
connector.message-processing.transport-id-suffix=connector.ecodex.eu
# P-Mode verification of outbound messages (connector → gateway) before they are sent.
# STRICT: service and action must be declared in the P-Mode.
connector.message-processing.outbound-message-verification-mode=STRICT
# P-Mode verification of inbound messages (gateway → connector) upon receipt.
# RELAXED: service and action, plus the from/to parties, must be declared in the P-Mode.
connector.message-processing.inbound-message-verification-mode=RELAXED

##################################################################################
############################## FILE STORAGE CONFIGURATIONS #######################
##################################################################################
# S3 secret access key
connector.file.storage.s3.secret-key=${S3_SECRET_KEY}
# S3 access key ID
connector.file.storage.s3.access-key=${S3_ACCESS_KEY}
# AWS region the bucket lives in (e.g. "eu-west-1"). For non-AWS
# S3-compatible providers this may be a placeholder/arbitrary value.
connector.file.storage.s3.region=${S3_REGION}
# Name of the S3 bucket used to store files.
connector.file.storage.s3.bucket=${S3_BUCKET}
# S3 endpoint URL. Only needed when targeting a non-default AWS endpoint — e.g., a self-hosted
# S3-compatible service like MinIO or a specific regional/VPC endpoint.
connector.file.storage.s3.endpoint=${S3_ENDPOINT}

##################################################################################
######################### REM EVIDENCE CONFIG ####################################
##################################################################################
# Keystore holding the private key/cert used to sign evidence documents.
connector.evidences.signature.keystore.path=file:./config/keystores/connector-keystore.jks
# Keystore password.
connector.evidences.signature.keystore.password=12345
# Keystore format. JKS is the legacy Java format; PKCS12 is the more modern/portable alternative
# if you ever migrate the keystore.
connector.evidences.signature.keystore.type=JKS
# Alias of the key entry within the keystore used for signing evidence
connector.evidences.signature.private-key.alias=connector_blue
# Password for that specific private key entry.
connector.evidences.signature.private-key.password=12345
# The digest (SHA-256) and signature (RSA) algorithms used for evidences are fixed.

# Display name of the issuing party as it will appear in the evidence record.
connector.evidences.issuer.as4-party.name=Connector NG
# Contact/endpoint address for the issuing party.
connector.evidences.issuer.as4-party.endpoint-address=mailto:gateway@connector.example

# Issuer postal address — embedded in evidence as the legal/physical
# address of the issuing entity
connector.evidences.issuer.postal-address.street=Unknown Street 1
connector.evidences.issuer.postal-address.locality=Unknown
connector.evidences.issuer.postal-address.zip-code=0000
connector.evidences.issuer.postal-address.country=EU

##################################################################################
### DSS (Digital Signature Service) — trust list cache & network config ##########
##################################################################################
# cache configuration
# Local filesystem cache where DSS persists downloaded/parsed Trusted
# List (TL) and List of Trusted Lists (LOTL) data, so it doesn't have
# to re-fetch everything on every application restart.
# Format: Spring "file:" resource URI, relative to the working directory.
connector.dss.cache.location=file:./data/tlcache
# Max age of the cached trust data before DSS treats it as stale and
# re-downloads from the sources configured below.
# Format: Spring Boot duration shorthand (e.g. "1d", "12h", "30m").
connector.dss.cache.expiration=1d

# -----------------------------------------------------------------
# Proxy configuration (optional)
# -----------------------------------------------------------------
# Used only for DSS's outbound calls to fetch:
#   - LOTL / Trusted List XML
#   - CRL (Certificate Revocation List) updates
#   - OCSP (Online Certificate Status Protocol) responses
# Set host+port for HTTP and/or HTTPS if the environment requires
#connector.dss.proxy.http.host=proxy1.example.com
#connector.dss.proxy.http.port=8080
#connector.dss.proxy.https.host=proxy1.example.com
#connector.dss.proxy.https.port=8080

# LOTL source: the EU master list that points to each member state's
# national Trusted List.
#connector.dss.trust-list-sources.eu.lotl-sources[0].lotl-url=https://ec.europa.eu/tools/lotl/eu-lotl.xml

# URL of the Official Journal notice announcing the certificates used
# to verify the LOTL's own signature (the trust anchor for the LOTL).
#connector.dss.trust-list-sources.eu.lotl-sources[0].signing-certificates-announcement-uri=https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=uriserv:OJ.C_.2019.276.01.0001.01.ENG

# Enables pivot support, so DSS can follow historical LOTL "pivot"
# versions and keep trust anchors valid as the EU rotates LOTL
# signing certificates over time.
#connector.dss.trust-list-sources.eu.lotl-sources[0].pivot-support=true

# A standalone national Trusted List fetched directly (not via the LOTL).
#connector.dss.trust-list-sources.eu.tl-sources[0].tl-url=https://www.signatur.rtr.at/currenttl.xml

# -----------------------------------------------------------------
# Timestamp (TSA) servers (optional)
# -----------------------------------------------------------------
# RFC 3161 Time-Stamping Authority endpoints DSS can use when a
# signature needs a timestamp.
#connector.dss.time-stamp-servers.t1.url=http://dss.nowina.lu/pki-factory/tsa/good-tsa
#connector.dss.time-stamp-servers.ee-good-tsa.url=http://dss.nowina.lu/pki-factory/tsa/ee-good-tsa

##################################################################################
######################## CONTAINER CONFIGURATIONS ################################
##################################################################################
# Settings for the security library for generating the Token.
# Path to the Java KeyStore (JKS) holding the private key/certificate
# used to SIGN containers (as opposed to validating them).
connector.container.signature.keystore.path=file:./config/keystores/connector-keystore.jks
# Password protecting the keystore file itself.
connector.container.signature.keystore.password=12345
# Keystore format. JKS is the legacy Java format; PKCS12 is the more
# modern/portable alternative if you ever migrate the keystore.
connector.container.signature.keystore.type=JKS
# Alias identifying which key entry inside the keystore to use for
# signing (a keystore can hold multiple key pairs/certs).
connector.container.signature.private-key.alias=connector_blue
# Password protecting that specific private key entry
connector.container.signature.private-key.password=12345
connector.container.signature.validation.constraints-xml=classpath:/102853/constraint.xml

##################################################################################
################## BUSINESS DOCUMENT VALIDATION CONFIGURATIONS ###################
##################################################################################
# business document validation
# Identifier of the service provider issuing/handling the business document.
connector.business-document.service-provider=TestProvider
# Two-letter country code associated with this connector instance for business document processing.
connector.business-document.country=BL
# Default type of "advanced" electronic system used to qualify the document/transaction.
# AUTHENTICATION_BASED is also applicable
connector.business-document.default-advanced-system-type=SIGNATURE_BASED
# Truststore containing the trusted certificates/CA chains used to
# validate signatures on incoming business documents
connector.business-document.signature.validation.truststore.path=file:./config/keystores/connector-truststore.jks
# Password protecting the truststore.
connector.business-document.signature.validation.truststore.password=12345
# Truststore format (JKS legacy format, as with the signing keystore).
# PKCS12 is the more modern/portable alternative if you ever migrate the truststore.
connector.business-document.signature.validation.truststore.type=JKS
# Same ETSI/eCodex validation policy file (102853) used here to
# constrain which signature/digest algorithms and certificate
# qualities are accepted when validating business document signatures.
connector.business-document.signature.validation.constraints-xml=classpath:/102853/constraint.xml
# Identity provider used to validate authentication claims attached
# to the business document.
connector.business-document.authentication-validation.identity-provider=ERV

