# e-CODEX connector plugin for Domibus (push mode), used by connector 6.x only.
# Loaded by Domibus from ${domibus.config.location}/plugins/config/dc-push-plugin.properties
# Key store: gw_blue (private key, signs and decrypts) + connector_blue (certificate, encrypts to the connector)
connector.delivery.trust-store.file=file:///${domibus.config.location}/keystores/gw-gwlink-keystore.p12
connector.delivery.trust-store.password=123456
connector.delivery.trust-store.type=PKCS12
connector.delivery.key-store.file=file:///${domibus.config.location}/keystores/gw-gwlink-keystore.p12
connector.delivery.key-store.password=123456
connector.delivery.key-store.type=PKCS12
connector.delivery.private-key.alias=gw_blue
connector.delivery.private-key.password=123456
connector.delivery.encrypt-alias=connector_blue
# the gateway pushes received messages and evidences to the 6.x connector (gwwspushplugin)
connector.delivery.service.address=http://connector6:9081/services/gateway
connector.delivery.service.service.security-policy=classpath:/wsdl/backend.policy.xml
dcplugin.auth.use-username-from=DEFAULT
dcplugin.auth.username=dcplugin
dcplugin.auth.roles=ROLE_ADMIN
dcplugin.push.publish.url=/dcpushplugin
dcplugin.push.enabled=true
