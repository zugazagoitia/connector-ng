## e-CODEX connector 6.1.0 -- lab "self-send" configuration
## One gateway (Domibus, party service_blue_ecodex) that sends to itself, one backend (alice, pull mode).
## Keystores (config/keystores) are prepared by scripts/prepare.sh from the 7.1.0 image and the
## connector-ng gateway sample keystores.

server.port=9081

########## gateway link: e-CODEX connector push plugin in Domibus ##########
connector.link.gateway.link-config.config-name=default
connector.link.gateway.link-config.link-impl=gwwspushplugin
connector.link.gateway.link-config.properties.gw-address=http://gateway:8080/domibus/services/dcpushplugin
connector.link.gateway.link-config.properties.gw-delivery-service-publish-address=/gateway
connector.link.gateway.link-config.properties.soap.key-store.path=file:./config/keystores/connector-gwlink.p12
connector.link.gateway.link-config.properties.soap.key-store.type=PKCS12
connector.link.gateway.link-config.properties.soap.key-store.password=123456
connector.link.gateway.link-config.properties.soap.private-key.alias=connector_blue
connector.link.gateway.link-config.properties.soap.private-key.password=123456
connector.link.gateway.link-config.properties.soap.trust-store.path=file:./config/keystores/connector-gwlink.p12
connector.link.gateway.link-config.properties.soap.trust-store.type=PKCS12
connector.link.gateway.link-config.properties.soap.trust-store.password=123456
connector.link.gateway.link-config.properties.soap.encrypt-alias=gw_blue
connector.link.gateway.link-config.properties.cxf-logging-enabled=false

connector.link.gateway.link-partners[0].link-partner-name=default_gateway
connector.link.gateway.link-partners[0].description=Domibus 5.1.9 with the connector push plugin
connector.link.gateway.link-partners[0].enabled=true
connector.link.gateway.link-partners[0].send-link-mode=push
connector.link.gateway.link-partners[0].rcv-link-mode=passive

########## backend link: SOAP web service, alice pulls ##########
connector.link.backend[0].link-config.config-name=default_backend_config
connector.link.backend[0].link-config.link-impl=wsbackendplugin
connector.link.backend[0].link-config.properties.soap.key-store.path=file:./config/keystores/backend-keystore.jks
connector.link.backend[0].link-config.properties.soap.key-store.password=12345
connector.link.backend[0].link-config.properties.soap.private-key.alias=connector_blue
connector.link.backend[0].link-config.properties.soap.private-key.password=12345
connector.link.backend[0].link-config.properties.soap.trust-store.path=file:./config/keystores/backend-keystore.jks
connector.link.backend[0].link-config.properties.soap.trust-store.password=12345
connector.link.backend[0].link-config.properties.soap.encrypt-alias=alice
connector.link.backend[0].link-config.properties.cxf-logging-enabled=false

connector.link.backend[0].link-partners[0].link-partner-name=backend_alice
connector.link.backend[0].link-partners[0].description=lab backend that sends to itself
connector.link.backend[0].link-partners[0].enabled=true
connector.link.backend[0].link-partners[0].send-link-mode=passive
connector.link.backend[0].link-partners[0].rcv-link-mode=passive
connector.link.backend[0].link-partners[0].properties.encryption-alias=alice
connector.link.backend[0].link-partners[0].properties.certificate-dn=cn=alice

connector.routing.default-backend-name=backend_alice

########## evidences ##########
# long timeouts: the lab must not reject messages while it waits for the upgrade
connector.controller.evidence.timeoutActive=true
connector.controller.evidence.checkTimeout=1m
connector.controller.evidence.relayREMMDTimeout=12h
connector.controller.evidence.deliveryTimeout=24h
connector.controller.evidence.retrievalTimeout=24h

connector.evidences.signature.key-store.path=file:./config/keystores/connector-keystore.jks
connector.evidences.signature.key-store.password=12345
connector.evidences.signature.key-store.type=JKS
connector.evidences.signature.private-key.alias=connector_blue
connector.evidences.signature.private-key.password=12345
connector.evidences.issuer-info.postal-address.country=BL
connector.evidences.issuer-info.postal-address.locality=Blue City
connector.evidences.issuer-info.postal-address.street=Lab street 1
connector.evidences.issuer-info.postal-address.zip-code=1000

########## ASiC-S container and business document ##########
connector.ecodex-container.signature-validation.validation-constraints-xml=classpath:/102853/constraint.xml
connector.ecodex-container.signature.keystore.path=file:./config/keystores/connector-keystore.jks
connector.ecodex-container.signature.keystore.password=12345
connector.ecodex-container.signature.private-key.alias=connector_blue
connector.ecodex-container.signature.private-key.password=12345

connector.business-document-sent.service-provider=Lab Provider
connector.business-document-sent.country=BL
connector.business-document-sent.default-advanced-system-type=AUTHENTICATION_BASED
connector.business-document-sent.signature-validation.trust-store.path=file:./config/keystores/connector-truststore.jks
connector.business-document-sent.signature-validation.trust-store.password=12345
connector.business-document-sent.signature-validation.validation-constraints-xml=classpath:/102853/constraint.xml
connector.business-document-sent.authentication-validation.identity-provider=ERV

connector.dss.tl-cache-location=file:./data/tlcache

########## P-Mode upload at the first start (lane default_message_lane) ##########
connector.init.pmode.enabled=true
connector.init.pmode.upload[0].trust-store.type=JKS
connector.init.pmode.upload[0].trust-store.password=12345
connector.init.pmode.upload[0].trust-store.path=file:./config/keystores/connector-truststore.jks
connector.init.pmode.upload[0].p-mode-xml=file:./config/pmode-selfsend.xml

connector.init.user.enabled=true
connector.init.user.initialUserName=admin
connector.init.user.initialUserPassword=admin
connector.init.user.initialChangeRequired=false

########## database (MariaDB, XA) ##########
spring.datasource.url=jdbc:mariadb://connector6-db:3306/connector6
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.xa.data-source-class-name=org.mariadb.jdbc.MariaDbDataSource
spring.datasource.username=connector
spring.datasource.password=connector

########## payloads stored in the database ##########
connector.persistence.default-large-file-provider-class=eu.ecodex.connector.persistence.largefiles.provider.LargeFilePersistenceServiceJpaImpl

########## embedded Artemis, JTA ##########
spring.artemis.mode=embedded
spring.artemis.embedded.enabled=true
spring.artemis.embedded.persistent=true
spring.artemis.embedded.data-directory=./data/artemis/
spring.jta.log-dir=./data/jtalog
